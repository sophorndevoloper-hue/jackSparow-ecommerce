<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)" rx="16" />

  <!-- Circuit Grid Accents -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <path d="M 0 50 H 400 M 0 100 H 400 M 0 150 H 400 M 0 200 H 400 M 0 250 H 400" />
    <path d="M 50 0 V 300 M 100 0 V 300 M 150 0 V 300 M 200 0 V 300 M 250 0 V 300 M 300 0 V 300 M 350 0 V 300" />
  </g>

  <!-- Center Glow Aura -->
  <circle cx="200" cy="140" r="70" fill="#2563eb" opacity="0.15" filter="url(#glow)" />

  <!-- Circuit Traces Connecting to Chip -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.4" stroke-linecap="round">
    <path d="M 140 140 H 80 L 60 120" />
    <circle cx="60" cy="120" r="3" fill="#38bdf8" />

    <path d="M 260 140 H 320 L 340 160" />
    <circle cx="340" cy="160" r="3" fill="#38bdf8" />

    <path d="M 200 80 V 40 L 220 25" />
    <circle cx="220" cy="25" r="3" fill="#38bdf8" />

    <path d="M 200 200 V 230 L 180 245" />
    <circle cx="180" cy="245" r="3" fill="#38bdf8" />
  </g>

  <!-- Hardware Chip Body -->
  <rect x="155" y="95" width="90" height="90" rx="14" fill="#1e293b" stroke="url(#chipGrad)" stroke-width="2.5" filter="url(#glow)" />
  <rect x="165" y="105" width="70" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

  <!-- Chip Pins -->
  <g stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <!-- Top Pins -->
    <line x1="175" y1="95" x2="175" y2="87" />
    <line x1="190" y1="95" x2="190" y2="87" />
    <line x1="205" y1="95" x2="205" y2="87" />
    <line x1="220" y1="95" x2="220" y2="87" />

    <!-- Bottom Pins -->
    <line x1="175" y1="185" x2="175" y2="193" />
    <line x1="190" y1="185" x2="190" y2="193" />
    <line x1="205" y1="185" x2="205" y2="193" />
    <line x1="220" y1="185" x2="220" y2="193" />

    <!-- Left Pins -->
    <line x1="155" y1="115" x2="147" y2="115" />
    <line x1="155" y1="130" x2="147" y2="130" />
    <line x1="155" y1="145" x2="147" y2="145" />
    <line x1="155" y1="160" x2="147" y2="160" />

    <!-- Right Pins -->
    <line x1="245" y1="115" x2="253" y2="115" />
    <line x1="245" y1="130" x2="253" y2="130" />
    <line x1="245" y1="145" x2="253" y2="145" />
    <line x1="245" y1="160" x2="253" y2="160" />
  </g>

  <!-- Glowing Core Icon inside Chip -->
  <g fill="none" stroke="url(#chipGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 190 130 L 200 120 L 210 130 L 200 140 Z" fill="#2563eb" fill-opacity="0.25" />
    <circle cx="200" cy="140" r="16" stroke="#38bdf8" stroke-dasharray="3 3" opacity="0.7" />
  </g>

  <!-- Center Lightning/Power Bolt -->
  <path d="M 202 131 L 196 141 L 201 141 L 198 150 L 205 139 L 200 139 Z" fill="#38bdf8" />

  <!-- Dynamic Bottom Separator Line -->
  <line x1="50" y1="215" x2="350" y2="215" stroke="url(#lineGrad)" stroke-width="1.5" />

  <!-- Label Typography -->
  <text x="200" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#f8fafc" letter-spacing="2">JACKSPARROW TECH</text>
  <text x="200" y="258" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#94a3b8" letter-spacing="1.5">HIGH-PERFORMANCE HARDWARE</text>
</svg>
